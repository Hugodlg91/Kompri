name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify tag matches tauri.conf.json version
        shell: bash
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXPECTED_TAG="v${CONF_VER}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version (${EXPECTED_TAG})"
            exit 1
          fi

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      # ── FFmpeg — Windows ───────────────────────────────────────────────────
      - name: Download FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          $out = "$env:TEMP\ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $folder = Get-ChildItem -Path $out -Directory | Select-Object -First 1
          $binDir = Join-Path $folder.FullName "bin"
          Copy-Item "$binDir\ffmpeg.exe"  "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"  -Force
          Copy-Item "$binDir\ffprobe.exe" "src-tauri\binaries\ffprobe-x86_64-pc-windows-msvc.exe" -Force

      # ── FFmpeg — macOS (Static aarch64-apple-darwin) ──────────────────────
      - name: Download Static FFmpeg (macOS arm64)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          FFMPEG_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
          FFPROBE_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64.gz"
          curl -fSL "$FFMPEG_URL" -o /tmp/ffmpeg-darwin-arm64.gz
          curl -fSL "$FFPROBE_URL" -o /tmp/ffprobe-darwin-arm64.gz
          echo "8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa  /tmp/ffmpeg-darwin-arm64.gz" | shasum -a 256 -c -
          echo "d986a8ec7b030899fe66a8a288ed809a3543338705a3ce178cfb85869c5d80be  /tmp/ffprobe-darwin-arm64.gz" | shasum -a 256 -c -
          gunzip -c /tmp/ffmpeg-darwin-arm64.gz > src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          gunzip -c /tmp/ffprobe-darwin-arm64.gz > src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Verify macOS FFmpeg static linkage (otool -L)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          for bin in src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin; do
            echo "=== otool -L $bin ==="
            OTOOL_OUT=$(otool -L "$bin")
            echo "$OTOOL_OUT"
            if echo "$OTOOL_OUT" | grep -E "(/opt/homebrew|/usr/local)"; then
              echo "::error::$bin dynamically links to Homebrew or /usr/local!"
              exit 1
            fi
          done

      # ── FFmpeg — Linux ─────────────────────────────────────────────────────
      - name: Download FFmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          FOLDER=$(find /tmp -maxdepth 1 -name 'ffmpeg-*-amd64-static' -type d | head -1)
          cp "$FOLDER/ffmpeg"  src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp "$FOLDER/ffprobe" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      # ── FFmpeg Smoke Test (All Platforms) ──────────────────────────────────
      - name: Smoke test bundled FFmpeg & FFprobe
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows-latest)
              FFMPEG_BIN="src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
              FFPROBE_BIN="src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe"
              ;;
            macos-latest)
              FFMPEG_BIN="src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
              FFPROBE_BIN="src-tauri/binaries/ffprobe-aarch64-apple-darwin"
              ;;
            ubuntu-22.04)
              FFMPEG_BIN="src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"
              FFPROBE_BIN="src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu"
              ;;
            *)
              echo "::error::Unsupported matrix platform: ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          "$FFMPEG_BIN" -version
          "$FFPROBE_BIN" -version

          # Verify all video & audio encoders used by Kompri are compiled in:
          # - Video: libx264 (H.264 / MP4 / MKV / MOV / target-size), libx265 (H.265),
          #          libvpx-vp9 (VP9 / WebM), mpeg4 (AVI default video)
          # - Audio: aac (AAC / M4A / MP4 / MOV / target-size), libmp3lame (MP3 / AVI),
          #          flac (FLAC), libvorbis (OGG / MKV default audio),
          #          libopus (WebM default audio), pcm_s16le (WAV)
          ENCODERS_OUT=$("$FFMPEG_BIN" -hide_banner -encoders)
          REQUIRED_ENCODERS=(
            libx264
            libx265
            libvpx-vp9
            mpeg4
            aac
            libmp3lame
            flac
            libvorbis
            libopus
            pcm_s16le
          )
          for enc in "${REQUIRED_ENCODERS[@]}"; do
            if ! echo "$ENCODERS_OUT" | grep -E "^[[:space:]]*[A-Z\.]{6}[[:space:]]+${enc}([[:space:]]|$)" > /dev/null; then
              echo "::error::Bundled FFmpeg is missing required encoder: ${enc}"
              exit 1
            fi
            echo "Verified encoder: ${enc}"
          done

          # "Max quality" target-size filters. These strings MUST match
          # MAX_QUALITY_DENOISE_FILTER in src-tauri/src/target_size.rs.
          MQ_DENOISE="hqdn3d=0.6:0.4:0.9:0.6"

          FILTERS_OUT=$("$FFMPEG_BIN" -hide_banner -filters)
          for flt in hqdn3d scale fps; do
            if ! echo "$FILTERS_OUT" | grep -E "^[[:space:]]*[A-Z.]{2,3}[[:space:]]+${flt}[[:space:]]" > /dev/null; then
              echo "::error::Bundled FFmpeg is missing required filter: ${flt}"
              exit 1
            fi
            echo "Verified filter: ${flt}"
          done

          SMOKE_MP4="smoke_test_$$.mp4"
          SMOKE_MQ_X264="smoke_mq_x264_$$.mp4"
          SMOKE_MQ_X265="smoke_mq_x265_$$.mp4"
          trap 'rm -f "$SMOKE_MP4" "$SMOKE_MQ_X264" "$SMOKE_MQ_X265"' EXIT

          "$FFMPEG_BIN" -y -f lavfi -i "testsrc2=size=320x240:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac "$SMOKE_MP4"
          "$FFPROBE_BIN" -v error -show_format -show_streams "$SMOKE_MP4"
          rm -f "$SMOKE_MP4"

          # Max quality chain (same order as the app): fps -> denoise -> scale,
          # encoded with -preset slow. 640x360@60 -> 320x180@30.
          MQ_CHAIN="fps=30,${MQ_DENOISE},scale=320:180"
          for pair in "libx264:$SMOKE_MQ_X264" "libx265:$SMOKE_MQ_X265"; do
            codec="${pair%%:*}"
            out="${pair#*:}"
            "$FFMPEG_BIN" -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=60" -t 1 \
              -vf "$MQ_CHAIN" -pix_fmt yuv420p -c:v "$codec" -preset slow -b:v 500k "$out"
            DIMS=$("$FFPROBE_BIN" -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$out" | tr -d '\r')
            if [ "$DIMS" != "320x180" ]; then
              echo "::error::Max quality smoke encode (${codec} -preset slow) produced ${DIMS}, expected 320x180"
              exit 1
            fi
            echo "Verified max-quality encode: ${codec} -> ${DIMS}"
            rm -f "$out"
          done

      # ── Build & publish ────────────────────────────────────────────────────
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kompri ${{ github.ref_name }}"
          releaseBody: |
            ## Kompri ${{ github.ref_name }}

            Kompri was called **MediaForge** up to v1.2.1. See the CHANGELOG for migration notes.

            ### Download
            - **Windows** : `Kompri_<version>_x64-setup.exe` (recommended) or `.msi`
            - **macOS** : `Kompri_<version>_aarch64.dmg`
            - **Linux** : `Kompri_<version>_amd64.AppImage`, `.deb` or `.rpm`

            ### Requirements
            No additional runtime required — FFmpeg is bundled.

            See [CHANGELOG](https://github.com/Hugodlg91/Kompri/blob/main/CHANGELOG.md)
            for full release notes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
